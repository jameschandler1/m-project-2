name: Frontend Build Check

on:
  push:
  pull_request:

jobs:
  build-react:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install React Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React Application
        working-directory: ./frontend
        run: npm run build

        - name: Install Solid Dependencies
        working directory: ./frontend-sld
        run : npm install

        - name: Build Solid Application
        working-directory: ./frontend-sld
        run: npm run build