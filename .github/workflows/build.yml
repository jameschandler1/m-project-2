name: Frontend Build Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build React
        working-directory: frontend
        run: npm run build

      - name: Build Solid
        working-directory: frontend-sld
        run: npm run build

      - name: Build HTMX
        working-directory: frontend-htmx
        run: npm run build