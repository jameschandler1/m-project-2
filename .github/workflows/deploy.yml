name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - Frontend Build Check
    types:
      - completed
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check Backend Tests Status
        run: |
          # Check if Backend Tests workflow also passed
          backend_status=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?event=push&branch=main" | \
            jq -r '.workflow_runs[] | select(.name=="Backend Tests") | .conclusion' | head -1)
          
          if [ "$backend_status" != "success" ]; then
            echo "Backend Tests did not pass (status: $backend_status). Skipping deployment."
            exit 1
          fi

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: /tmp/ssh_key
          port: 22
          script: |
            cd ~/m-project-2

            git pull origin main

            npm ci || exit 1

            cd frontend
            npm run build || exit 1
            sudo cp -r build/* /var/www/didyoudoityet/

            cd ../frontend-sld
            npm run build || exit 1
            sudo cp -r dist/* /var/www/didyoudoityet-solid/

            pm2 restart didyoudoityet-api
            pm2 restart htmx
            pm2 save